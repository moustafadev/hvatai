name: hvatai
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ^3.27.4

dependencies:
  flutter:
    sdk: flutter

  equatable: ^2.0.7
  dartz: ^0.10.1
  get_it: ^8.0.3
  internet_connection_checker: ^1.0.0+1
  mask_text_input_formatter: ^2.5.0
  flutter_svg: ^2.0.17
  device_info_plus: ^9.1.0
  flutter_screenutil: ^5.9.1
  image_picker: ^1.0.7
  intl: any
  shared_preferences: ^2.2.3
  geolocator: ^11.0.0
  geocoding: ^4.0.0
  dotted_border: ^2.0.0
  dio: ^5.4.3+1
  flutter_bloc: ^8.1.5
  bloc: ^8.1.4
  auto_route: ^9.3.0+1
  json_annotation: ^4.9.0
  persistent_bottom_nav_bar: ^6.2.1
  permission_handler: ^11.3.1
  go_router: ^14.8.0
  persistent_bottom_nav_bar_v2: ^5.3.1
  device_preview: ^1.2.0
  google_fonts: ^6.2.1
  freezed_annotation: ^2.4.4
  easy_localization: ^3.0.7+1
  cached_network_image: ^3.4.1
  provider: ^6.1.4
  flutter_localizations:
    sdk: flutter
  dropdown_button2: ^2.3.9
  responsive_grid_list: ^1.4.0
  toastification: ^3.0.3
  pusher_client_socket: ^0.0.3+1
  livekit_client: ^2.3.1+hotfix.1
  flutter_webrtc: ^0.12.12+hotfix.1
  wakelock_plus: ^1.4.0
  flutter_html: ^3.0.0
  video_player: ^2.10.1
  video_thumbnail: ^0.5.3
  # ffmpeg_kit_flutter_new: ^4.1.0
  path_provider: ^2.1.1
  http: ^1.2.0
  readmore: ^3.0.0
  path: ^1.9.1
  saver_gallery: ^4.1.0
  image: ^4.7.2
  package_info_plus: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  json_serializable: ^6.9.4
  freezed: ^2.4.6

flutter_assets:
  assets_path: assets/
  output_path: lib/core/theme
  filename: assets.dart

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/translations/

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope/Manrope-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Manrope/Manrope-Light.ttf
          weight: 300
        - asset: assets/fonts/Manrope/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope/Manrope-ExtraBold.ttf
          weight: 800

  generate: true
